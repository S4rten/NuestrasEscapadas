name: NuestrasEscapadas

options:
  bundleIdPrefix: com.pareja
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

# Firebase 12.x: la 13.x exige Xcode 26.2 o superior y el runner macos-15 trae Xcode 16.
# "from: 12.0.0" significa "cualquier 12.x" (nunca saltará solo a la 13).
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NuestrasEscapadas:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # El plist DEBE ir como recurso: si no, la app no arranca la nube.
      - path: GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pareja.nuestrasescapadas
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        INFOPLIST_KEY_CFBundleDisplayName: "Escapadas"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Retos de fotos: sin estos textos iOS cierra la app al abrir la cámara o guardar una foto.
        INFOPLIST_KEY_NSCameraUsageDescription: "Para hacer las fotos y selfies de los retos del viaje."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Para guardar en tu galería las fotos de los retos."
